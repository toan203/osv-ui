name: Prepare version update

on:
  workflow_dispatch:
    inputs:
      version:
        description: New osv-ui version, for example 2.0.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Validate requested version
        run: |
          node -e "if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) process.exit(1)"
          if npm view "osv-ui@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "osv-ui@$RELEASE_VERSION already exists" >&2
            exit 1
          fi
      - run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - name: Open release PR
        run: |
          branch="automation/release-v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "chore: prepare osv-ui v$RELEASE_VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: release osv-ui v$RELEASE_VERSION" --body "Automated core version update. After merge, CI publishes osv-ui first and opens a synchronized osv-ui-mcp update PR."
